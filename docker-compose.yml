version: "3.8"

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"

  backend:
    build: .
    container_name: backend-template
    ports:
      - "3000:6000"
    environment:
      - PORT=6000
      - MONGO_URL=mongodb://mongo:27017/template
    depends_on:
      - mongo
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: package.json
        - action: rebuild
          path: .env